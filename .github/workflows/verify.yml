name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution build tools
        run: sudo apt-get update && sudo apt-get install -y emscripten libpq-dev libmicrohttpd-dev libsodium-dev libcurl4-openssl-dev libjson-c-dev ninja-build
      - name: Initialize isolated build configuration
        run: python3 scripts/init-env.py
      - name: Build browser client
        env:
          CODARIS_PRODUCTION: '1'
        run: ./scripts/build-client.sh
      - name: Check pages, CSP, links and public artifact boundaries
        run: python3 tests/check-site.py
      - name: Build native C backend
        run: cmake -S . -B build/server -G Ninja && cmake --build build/server
      - name: Package public site only
        run: python3 scripts/package-site.py ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codaris-static-site
          path: build/package/ci/
          if-no-files-found: error
          retention-days: 7
