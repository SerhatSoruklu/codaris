name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set weekly package cache key
        id: apt-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt-cache-restore
        with:
          path: ${{ runner.temp }}/codaris-apt/archives/*.deb
          key: ${{ runner.os }}-ubuntu-24.04-apt-${{ hashFiles('.github/ci-build-packages.txt') }}-${{ steps.apt-cache-week.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-apt-${{ hashFiles('.github/ci-build-packages.txt') }}-
      - name: Install distribution build tools
        run: |
          set -euo pipefail
          apt_archives="$RUNNER_TEMP/codaris-apt/archives/"
          sudo install -d -o _apt -g root -m 0755 "$apt_archives/partial"
          mapfile -t requested_packages < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .github/ci-build-packages.txt)
          packages=()
          for package in "${requested_packages[@]}"; do
            case "$package" in
              binutils) binary=as ;;
              ninja-build) binary=ninja ;;
              nginx) binary=nginx ;;
              openssl) binary=openssl ;;
              *) packages+=("$package"); continue ;;
            esac
            if ! command -v "$binary" >/dev/null 2>&1; then
              packages+=("$package")
            fi
          done
          sudo apt-get -o Dir::Cache::archives="$apt_archives" update
          sudo apt-get -o Dir::Cache::archives="$apt_archives" install -y --no-install-recommends "${packages[@]}"
          sudo apt-get -o Dir::Cache::archives="$apt_archives" autoclean
      - name: Make Ubuntu package archives readable for cache storage
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/codaris-apt/archives" 2>/dev/null || true
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.apt-cache-restore.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/codaris-apt/archives/*.deb
          key: ${{ runner.os }}-ubuntu-24.04-apt-${{ hashFiles('.github/ci-build-packages.txt') }}-${{ steps.apt-cache-week.outputs.week }}
      - name: Initialize isolated build configuration
        run: python3 scripts/init-env.py
      - name: Build browser client
        env:
          CODARIS_PRODUCTION: '1'
        run: ./scripts/build-client.sh
      - name: Check pages, CSP, links and public artifact boundaries
        run: python3 tests/check-site.py
      - name: Validate CODARIS Nginx configuration
        run: ./scripts/check-nginx.sh
      - name: Build native C backend
        run: cmake -S . -B build/server -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/server
      - name: Stamp the verified commit into the site
        run: printf '%s\n' "$GITHUB_SHA" > build/client/version.txt
      - name: Package allowlisted site, API and Nginx files
        run: python3 scripts/package-site.py ci
      - name: Verify deployment helper syntax and package checksums
        run: |
          python3 -m py_compile deploy/codaris-deploy-release scripts/package-site.py
          (cd build/package/ci && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codaris-production-release
          path: build/package/ci/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy CODARIS production
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.CODARIS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://codaris.org
    concurrency:
      group: codaris-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codaris-production-release
          path: build/package/ci
      - name: Join the private deployment tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.CODARIS_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.CODARIS_TAILSCALE_OAUTH_SECRET }}
          tags: tag:codaris-ci
          ping: ${{ vars.CODARIS_DEPLOY_HOST }}
      - name: Configure the dedicated deployment key and verified host key
        env:
          DEPLOY_KEY: ${{ secrets.CODARIS_DEPLOY_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.CODARIS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.CODARIS_DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.CODARIS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_HOST" && -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo 'Configure production environment key, host and verified known_hosts values before deploying.' >&2
            exit 1
          }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid deployment host.' >&2; exit 1; }
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT < 65536 )) || {
            echo 'Invalid deployment SSH port.' >&2
            exit 1
          }
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/codaris_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/codaris_known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host codaris-rbx
            HostName $DEPLOY_HOST
            User codaris-deploy
            Port $DEPLOY_PORT
            IdentityFile $HOME/.ssh/codaris_deploy
            UserKnownHostsFile $HOME/.ssh/codaris_known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ForwardAgent no
            ClearAllForwardings yes
          EOF
          chmod 0600 "$HOME/.ssh/codaris_deploy" "$HOME/.ssh/codaris_known_hosts" "$HOME/.ssh/config"
          ssh -o BatchMode=yes codaris-rbx 'test "$(id -un)" = codaris-deploy'
      - name: Activate the site and CODARIS Nginx policy
        run: ./scripts/deploy.sh codaris-rbx ci
