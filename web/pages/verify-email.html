<section class="wrap section account-page verification-page" aria-labelledby="verification-title">
<article class="account-card verification-card">
<img src="/assets/emblem.svg" width="56" height="56" alt="">
<p class="eyebrow">CODARIS / EMAIL VERIFICATION</p>
<h1 id="verification-title">Verify your email</h1>
<p id="verification-description">Open the verification link in your email to activate your membership.</p>
<form data-account-form="verify"><fieldset data-account-fields disabled><button id="verification-retry" class="button" type="submit" hidden>Try again</button></fieldset></form>
<p id="verify-feedback" class="account-notice" role="status" aria-atomic="true"></p>
<a class="button small" href="/login/">Continue to login <span aria-hidden="true">→</span></a>
<p class="field-hint">Need a new link? Log in and select “Resend verification email”.</p>
</article></section>
