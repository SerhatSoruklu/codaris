<section class="wrap section logout-page" aria-labelledby="logout-title">
  <article class="logout-card">
    <span class="logout-mark" aria-hidden="true">
      <svg class="icon" focusable="false"><use href="/assets/icons/lucide.svg#log-out"></use></svg>
    </span>
    <p class="eyebrow">CODARIS / SESSION</p>
    <h1 class="page-title" id="logout-title">Signing you out.</h1>
    <p class="logout-copy">Your session is being ended securely. You’ll return to sign in when it’s complete.</p>
    <p class="account-notice" id="logout-feedback" role="status" aria-atomic="true"></p>
    <form data-account-form="logout" data-auto-account-operation="logout">
      <fieldset data-account-fields disabled>
        <button class="button logout-retry" type="submit"><svg class="icon icon--sm" aria-hidden="true" focusable="false"><use href="/assets/icons/lucide.svg#log-out"></use></svg> Try signing out again</button>
      </fieldset>
    </form>
    <a class="logout-home" href="/">Return to CODARIS</a>
  </article>
</section>
