limit_req_zone $binary_remote_addr zone=codaris_api:10m rate=5r/s;
# Install only after the codaris.org certificate exists. No Cloudflare dependency.
server {
    listen 80;
    listen [::]:80;
    server_name codaris.org www.codaris.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/codaris/acme;
        try_files $uri =404;
    }
    location / { return 308 https://codaris.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.codaris.org;
    ssl_certificate /etc/letsencrypt/live/codaris.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codaris.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://codaris.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codaris.org;
    ssl_certificate /etc/letsencrypt/live/codaris.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codaris.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    root /srv/codaris/current;
    index index.html;
    autoindex off;
    client_max_body_size 96k;
    include /etc/nginx/snippets/codaris-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    access_log /var/log/nginx/codaris.access.log;
    error_log /var/log/nginx/codaris.error.log warn;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm image/svg+xml application/xml;
    error_page 404 /404.html;
    location = /404.html { internal; }
    # The opaque verification query is intentionally omitted from access logs.
    location = /verify/ {
        access_log off;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:conf|json|map|sql|py|sh|ps1|c|h|md|key|pem)$ { return 404; }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location ^~ /api/ {
        limit_req zone=codaris_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
        # API bodies, cookies and action tokens must never be logged.
        access_log off;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }
}
