# First-time HTTP-only virtual host; replace with codaris.conf after TLS issuance.
server {
    listen 80;
    listen [::]:80;
    server_name codaris.org www.codaris.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/codaris/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
