# Temporary, additive HTTP vhost for issuing api.codaris.org's first
# certificate without replacing the live codaris.org virtual host. Remove it
# after Certbot succeeds and before deploying codaris.conf with TLS enabled.
server {
    listen 80;
    listen [::]:80;
    server_name api.codaris.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/codaris/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
